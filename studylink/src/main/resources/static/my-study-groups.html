<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Study Groups - StudyLink</title>
    <link rel="stylesheet" href="/css/style.css?v=2">
    <script src="/js/auth-guard.js"></script>
</head>

<body>

    <header>
        <h1>StudyLink</h1>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="study-groups.html">Find Study Groups</a>
            <a href="#">Upcoming Sessions</a>
            <a href="#">Notifications</a>
        </nav>

        <div class="profile-menu">
            <button id="profileButton" class="profile-button">
                <span id="dashboardUserName">Student</span>
                <span class="profile-icon">👤</span>
            </button>

            <div id="profileDropdown" class="profile-dropdown">
                <a href="account.html">My Account</a>
                <a href="my-courses.html">My Courses</a>
                <a href="my-study-groups.html">My Study Groups</a>
                <button id="logoutButton">Logout</button>
            </div>
        </div>
    </header>

    <main class="container">

        <section class="card">
            <h2>My Study Groups</h2>
            <p>View and manage all study groups you have joined.</p>

            <div id="allMyStudyGroups">
                <p>Your study groups will appear here.</p>
            </div>
        </section>

    </main>

    <script src="/js/profile-menu.js"></script>
    <script src="/js/my-study-groups.js"></script>

    <script>
        const userName = localStorage.getItem("userName");

        if (userName) {
            document.getElementById("dashboardUserName").textContent = userName;
        }
    </script>

</body>

</html>
