<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Group Details - StudyLink</title>
    <link rel="stylesheet" href="/css/style.css?v=2">
    <script src="/js/auth-guard.js"></script>
</head>
<body>

<header>
    <h1>StudyLink</h1>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="study-groups.html">Find Study Groups</a>
        <a href="#">Upcoming Sessions</a>
        <a href="#">Notifications</a>
    </nav>

    <div class="profile-menu">
        <button id="profileButton" class="profile-button">
            <span id="dashboardUserName">Student</span>
            <span class="profile-icon">👤</span>
        </button>

        <div id="profileDropdown" class="profile-dropdown">
            <a href="account.html">My Account</a>
            <a href="my-courses.html">My Courses</a>
            <button id="logoutButton">Logout</button>
        </div>
    </div>
</header>

<main class="container">

    <section class="card">
        <h2 id="groupName">Study Group</h2>
        <p id="groupDescription">Loading group details...</p>
    </section>

    <section class="card">
        <h2>Group Information</h2>

        <div class="list-item">
            <h3>Course Code</h3>
            <p id="courseCode">Loading...</p>
        </div>

        <div class="list-item">
            <h3>School</h3>
            <p id="schoolName">Loading...</p>
        </div>

        <div class="list-item">
            <h3>Program / Course Name</h3>
            <p id="courseName">Loading...</p>
        </div>

        <div class="list-item">
            <h3>Section</h3>
            <p id="section">Loading...</p>
        </div>

        <div class="list-item">
            <h3>Meeting Time</h3>
            <p id="meetingTime">Loading...</p>
        </div>

        <a href="dashboard.html">
            <button class="secondary-button">Back to Dashboard</button>
        </a>

    </section>

</main>

<script src="/js/profile-menu.js"></script>
<script src="/js/group-details.js"></script>

</body>
</html>
